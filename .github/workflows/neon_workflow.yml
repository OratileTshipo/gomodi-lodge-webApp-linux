name: Create/Delete Branch for Pull Request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
      # Neon branch names cannot contain `/` — feature branches like
      # `docs/readme-refresh` previously produced `preview/pr-29-docs/readme-refresh`
      # and Neon rejected it with a 422. Sanitize once here so the create,
      # migrate, diff and delete steps all use the same name.
      sanitized: ${{ steps.sanitize.outputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

      - name: Sanitize branch name for Neon
        id: sanitize
        env:
          RAW_BRANCH: ${{ steps.branch_name.outputs.current_branch }}
        run: echo "name=$(echo "$RAW_BRANCH" | tr '/' '-')" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Get branch expiration date (14 days from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # Free-plan Neon caps branches (~10). Stale preview branches from closed
      # PRs were never deleted (the close job can miss fast merges), so the
      # project hit BRANCHES_LIMIT_EXCEEDED and every create 422'd. Prune old
      # preview/* branches before creating so this self-heals. The 3-day cutoff
      # keeps concurrent PRs' fresh preview branches alive.
      - name: Prune stale preview branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, datetime
          api = "https://console.neon.tech/api/v2/projects/" + os.environ["NEON_PROJECT_ID"]
          auth = ["-H", "Authorization: Bearer " + os.environ["NEON_API_KEY"]]
          out = subprocess.run(["curl", "-sS", api + "/branches", *auth], capture_output=True, text=True).stdout
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(days=3)
          def parse(ts):
              try: return datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              except Exception: return now
          deleted = 0
          for b in json.loads(out).get("branches", []):
              name = b.get("name") or ""
              if not name.startswith("preview/"):
                  continue
              updated = parse(b.get("updated_at") or b.get("created_at") or "")
              if updated >= cutoff:
                  continue
              print(f"deleting {b['id']} {name} (last updated {updated.isoformat()})")
              r = subprocess.run(["curl", "-sS", "-X", "DELETE", f"{api}/branches/{b['id']}", *auth], capture_output=True, text=True)
              if r.returncode != 0 or "error" in r.stdout.lower():
                  print("  WARN:", r.stdout[:300])
              else:
                  deleted += 1
          print(f"pruned {deleted} stale preview branch(es)")
          EOF

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.sanitized }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Note: GitHub Actions blanks action outputs that look like secrets
      # (e.g. connection strings), so we fetch the pooled URL with neonctl
      # instead of relying on steps.create_neon_branch.outputs.*.
      # If the PR was opened and closed within seconds, the delete job may
      # have already removed the preview branch before migrations run — in
      # that case there is nothing to migrate, so skip with a warning.
      # Any other neonctl failure still fails the job.
      - name: Run Migrations
        run: |
          npm i -g neonctl@v2
          if ! URL="$(neonctl connection-string "$NEON_BRANCH" --pooled --project-id "$NEON_PROJECT_ID" 2>/tmp/neonctl-err.txt)"; then
            if grep -q 'not found' /tmp/neonctl-err.txt; then
              echo "::warning::Preview branch $NEON_BRANCH was already removed (PR closed before migrations ran); skipping."
              exit 0
            fi
            cat /tmp/neonctl-err.txt >&2
            exit 1
          fi
          DATABASE_URL="$URL" npx drizzle-kit push
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.sanitized }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - name: Post Schema Diff Comment to PR
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.sanitized }}
          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.sanitized }}
          api_key: ${{ secrets.NEON_API_KEY }}
