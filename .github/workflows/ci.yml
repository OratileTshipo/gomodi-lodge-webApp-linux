name: CI

# Every PR (and every push to the release lines) is gated on the same checks
# the repo's PROGRESS.md validation checklist requires: a clean typecheck,
# zero NEW lint errors, and a green unit-test run.
on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  checks:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
