name: CI

# Every PR (and every push to the release lines) is gated on the same checks
# the repo's PROGRESS.md validation checklist requires: a clean typecheck,
# zero NEW lint errors, a green unit-test run, and the Playwright E2E suite
# (which runs against a real Postgres with seeded data).
on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  checks:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gomodi
          POSTGRES_PASSWORD: gomodi
          POSTGRES_DB: gomodi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gomodi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gomodi:gomodi@localhost:5432/gomodi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Push schema + seed data
        run: npm run db:push && npm run db:seed

      - name: Build
        run: npm run build

      - name: Run E2E suite (production server, strict budgets)
        run: E2E_SERVER=prod npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
